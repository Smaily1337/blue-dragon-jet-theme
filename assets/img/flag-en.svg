<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 14">
  <rect width="20" height="14" fill="#012169"/>
  <!-- white diagonals -->
  <line x1="0" y1="0" x2="20" y2="14" stroke="#fff" stroke-width="2.8"/>
  <line x1="20" y1="0" x2="0" y2="14" stroke="#fff" stroke-width="2.8"/>
  <!-- red diagonals -->
  <line x1="0" y1="0" x2="20" y2="14" stroke="#C8102E" stroke-width="1.6"/>
  <line x1="20" y1="0" x2="0" y2="14" stroke="#C8102E" stroke-width="1.6"/>
  <!-- white cross -->
  <rect x="8.5" y="0" width="3" height="14" fill="#fff"/>
  <rect x="0" y="5.5" width="20" height="3" fill="#fff"/>
  <!-- red cross -->
  <rect x="9" y="0" width="2" height="14" fill="#C8102E"/>
  <rect x="0" y="6" width="20" height="2" fill="#C8102E"/>
</svg>
